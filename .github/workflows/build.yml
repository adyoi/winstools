name: Build & Test

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ps2exe
        shell: powershell
        run: Install-Module ps2exe -Force -Scope CurrentUser

      - name: Build (tag v* -> versi tanpa 'v'; push main -> versi dev)
        shell: powershell
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($ref -match '^v[0-9]') { $ver = $ref -replace '^v', '' } else { $ver = '1.0.0' }
          Write-Host "Version: $ver (ref: $ref)"
          & .\Build\build.ps1 -Version $ver

      - name: Run Pester tests
        shell: powershell
        run: |
          $p = Get-Module Pester -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1
          Write-Host "Pester: $($p.Version)"
          if ($p.Version -ge [version]'5.0') {
            $r = Invoke-Pester -Path .\Test -PassThru
          } else {
            $r = Invoke-Pester -Script .\Test -PassThru
          }
          Write-Host ("Passed: {0}  Failed: {1}" -f $r.PassedCount, $r.FailedCount)
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winstools-${{ github.ref_name }}
          path: |
            Build/*
          if-no-files-found: error
